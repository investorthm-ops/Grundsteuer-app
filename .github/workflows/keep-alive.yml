name: Supabase Keep-alive

# Verhindert die Supabase-Free-Plan-Auto-Pause.
#
# Laut offizieller Supabase-Doku (Project Pausing) pausiert ein Free-Projekt
# nach 7 Tagen, wenn es NICHT "a few user requests to the database each day"
# erhaelt. Der fruehere Rhythmus (alle 3 Tage, Ping ueber die Vercel-App) war
# ZU SELTEN -> das Projekt pausierte am 2026-06-27 trotz "erfolgreicher" Pings,
# weil an 4-5 von 7 Tagen gar keine DB-Aktivitaet stattfand.
#
# Fix: MEHRMALS TAEGLICH (alle 6h = 4x/Tag) eine echte DB-Abfrage DIREKT gegen
# die Supabase-REST-API absetzen (nicht ueber Vercel, um Caching-/Deploy-
# Abhaengigkeiten auszuschliessen). Das erfuellt die dokumentierte Anforderung
# "a few user requests to the database each day".
#
# Hinweis: Es gibt keinen oeffentlichen Restore-API-Endpunkt. Dieser Workflow
# kann ein bereits pausiertes Projekt NICHT aufwecken (das geht nur manuell
# ueber das Dashboard). Er verhindert das Pausieren, solange das Projekt aktiv
# ist. Einzige garantierte Alternative laut Supabase: Upgrade auf Pro.
#
# Benoetigt nur bestehende Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: '0 */6 * * *'   # alle 6 Stunden = 4x taeglich (00/06/12/18 UTC)
  workflow_dispatch:

jobs:
  ping:
    name: DB-Ping
    runs-on: ubuntu-latest
    steps:
      - name: Direkte Supabase-DB-Abfrage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL oder SUPABASE_SERVICE_ROLE_KEY fehlt."
            exit 1
          fi

          URL="${SUPABASE_URL%/}/rest/v1/municipalities?select=id&limit=1"
          attempts=5

          for attempt in $(seq 1 "$attempts"); do
            code=$(curl -sS --connect-timeout 10 --max-time 30 \
              -o response.txt -w "%{http_code}" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$URL" || echo "000")

            if [ "$code" = "200" ]; then
              echo "Keep-alive erfolgreich (Versuch $attempt/$attempts, HTTP $code)."
              exit 0
            fi

            echo "::warning::Keep-alive-Versuch $attempt/$attempts fehlgeschlagen (HTTP $code)."
            head -c 300 response.txt 2>/dev/null || true
            echo

            if [ "$attempt" -lt "$attempts" ]; then
              sleep 20
            fi
          done

          echo "::error::Keep-alive nach $attempts Versuchen fehlgeschlagen (DB evtl. pausiert - Dashboard pruefen)."
          exit 1
